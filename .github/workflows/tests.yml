# Full test suite on every push and pull request, including the PostgreSQL tests (advisory locks, concurrent
# reservations, cross-midnight expiry, in-place upgrades, feedback suppression). Those skip without
# TEST_DATABASE_URL, so this job fails if any test is skipped.
#
# Production runs postgres:15 (deploy/docker-compose.yml); the suite was checked locally on 16.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: masumi
          POSTGRES_PASSWORD: masumi-ci
          POSTGRES_DB: agent_jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masumi -d agent_jobs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway CI database; the tests create and drop their own tables and schemas in it.
      TEST_DATABASE_URL: postgresql://masumi:masumi-ci@localhost:5432/agent_jobs_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite (with PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rs 2>&1 | tee pytest.log
          if grep -Eq "[0-9]+ skipped" pytest.log; then
            echo "::error::Some tests were skipped; the PostgreSQL tests must run in CI."
            exit 1
          fi
